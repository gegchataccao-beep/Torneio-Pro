function render(){$('#nav').innerHTML=NAV.map(n=>`<button style="--c:${n[2]}" class="${tab==n[0]?'on':''}" onclick="tab='${n[0]}';render()">${n[1]}</button>`).join('')+'<span class="tg" style="--c:#4cc9f0;align-self:center;flex:none">'+esc(W.list.find(x=>x.id==W.act).name)+'</span><button style="--c:#8e98c4;opacity:1" onclick="sec()">🔒 Segurança</button><button style="--c:#e63946;opacity:1" onclick="zerar()">🗑 Zerar tudo</button>';$('#app').innerHTML=V[tab]();save()}
const LK='torneio_lock';let LC=null,hid=0;try{LC=JSON.parse(localStorage.getItem(LK))}catch(e){}
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0)),saveLK=()=>{try{LC?localStorage.setItem(LK,JSON.stringify(LC)):localStorage.removeItem(LK)}catch(e){}};
async function hsh(pw,salt){const e=new TextEncoder();if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:ub(salt),iterations:150000,hash:'SHA-256'},k,256))}let h=5381;const t=salt+pw;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return'x'+h}
function showLock(){if(!LC)return;let d=$('#lk');if(!d){d=document.createElement('div');d.id='lk';document.body.appendChild(d)}d.className='ov';d.style.cssText='z-index:50;background:#0b1020';
d.innerHTML=`<div class="mo" style="text-align:center"><h2>🔒 Torneio Pro</h2><p class="mut">Introduz a senha para entrar</p><input id="lp" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter')unl()"><div class="row" style="justify-content:center"><button class="b g" onclick="unl()">Entrar</button>${LC.cred?'<button class="b o" onclick="bio()">👆 Biometria</button>':''}</div><p id="lm" class="bad"></p></div>`;setTimeout(()=>{const x=$('#lp');x&&x.focus()},200)}
const hideLock=()=>{const d=$('#lk');d&&d.remove()};
async function unl(){const h=await hsh($('#lp').value,LC.s);if(h==LC.h)hideLock();else{$('#lm').textContent='Senha errada.';$('#lp').value=''}}
async function bio(){try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:ub(LC.cred)}],userVerification:'required',timeout:60000}});hideLock()}catch(e){$('#lm').textContent='Biometria não confirmada. Usa a senha.'}}
const smsg=t=>{const e=$('#sm');if(e)e.textContent=t};
function sec(){$('#md').innerHTML=`<div class="ov" onclick="if(event.target==this)cl()"><div class="mo"><h3>🔒 Segurança</h3>${!LC?`<label>Nova senha (mín. 4 caracteres)<input id="s1" type="password"></label><label>Repetir senha<input id="s2" type="password"></label><button class="opt" style="--c:#06d6a0" onclick="setPw()">Ativar senha</button>`:`<button class="opt" style="--c:#4361ee;color:#fff" onclick="cl();showLock()">🔒 Bloquear agora</button><label>Senha atual<input id="s0" type="password"></label><label>Nova senha<input id="s1" type="password"></label><button class="opt" style="--c:#ff9f1c" onclick="setPw(1)">Mudar senha</button><button class="opt" style="--c:#06d6a0" onclick="${LC.cred?'offBio()':'onBio()'}">${LC.cred?'Desativar biometria':'👆 Ativar biometria (digital ou rosto)'}</button><button class="opt" style="--c:#e63946;color:#fff" onclick="rmPw()">Remover senha (escreve a senha atual acima)</button>`}<p id="sm" class="bad"></p><small>Aviso: a senha e a biometria bloqueiam a entrada no app, mas os dados ficam guardados no navegador sem encriptação.</small><button class="opt" style="--c:#555;color:#fff" onclick="cl()">Fechar</button></div></div>`}
async function setPw(ch){const n=$('#s1').value;if(ch&&await hsh($('#s0').value,LC.s)!=LC.h)return smsg('Senha atual errada.');if(n.length<4)return smsg('A senha precisa de pelo menos 4 caracteres.');if(!ch&&n!=$('#s2').value)return smsg('As senhas não coincidem.');
const salt=b64(crypto.getRandomValues(new Uint8Array(16)));LC={...(LC||{}),s:salt,h:await hsh(n,salt)};saveLK();sec();smsg('Senha guardada.')}
async function onBio(){if(!window.isSecureContext)return smsg('A biometria só funciona num endereço https (por exemplo o do Netlify) aberto no Chrome ou no Safari, não num ficheiro aberto do telemóvel nem dentro de outra app.');if(!window.PublicKeyCredential)return smsg('Este navegador não suporta biometria. Usa o Chrome ou o Safari.');try{if(!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()))return smsg('O telemóvel não tem digital ou rosto configurados para desbloqueio.')}catch(e){}try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Torneio Pro'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'torneio',displayName:'Torneio'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});LC.cred=b64(c.rawId);saveLK();sec();smsg('Biometria ativada.')}catch(e){smsg('Não foi possível ativar a biometria ('+e.name+'). Precisa de https e de digital ou rosto configurados no telemóvel.')}}
function offBio(){LC.cred=null;saveLK();sec();smsg('Biometria desativada.')}
async function rmPw(){if(await hsh($('#s0').value,LC.s)!=LC.h)return smsg('Escreve a senha atual no campo "Senha atual".');LC=null;saveLK();cl()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(LC&&hid&&Date.now()-hid>30000)showLock()});
autoWo();setInterval(autoWo,30000);if(LC)showLock();
render();
</script></body></html>

<script id="tp-miniapp-addons-script">
(()=>{
  const $id=id=>document.getElementById(id);
  const toast=msg=>{const el=$id('tp-toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(window.__tpToastTimer);window.__tpToastTimer=setTimeout(()=>el.classList.remove('show'),2800)};
  let installPrompt=null;
  const install=$id('tp-install');
  window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();installPrompt=ev;if(install)install.hidden=false});
  if(install)install.addEventListener('click',async()=>{
    if(!installPrompt){toast('Para instalar: abre esta página no Chrome, toca ⋮ e escolhe “Adicionar ao ecrã inicial”.');return}
    installPrompt.prompt();try{await installPrompt.userChoice}catch(e){}installPrompt=null;install.hidden=true;
  });
  window.addEventListener('appinstalled',()=>{if(install)install.hidden=true;toast('Torneio Pro instalado no dispositivo.')});

  if(fs)fs.addEventListener('click',async()=>{
    try{
      if(document.fullscreenElement){await document.exitFullscreen();toast('Ecrã completo desativado.');}
      else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();toast('A usar o ecrã completo.');}
      else toast('O navegador não permite ecrã completo neste modo. Podes usar “Adicionar ao ecrã inicial” no Chrome.');
    }catch(e){toast('O ecrã completo não está disponível neste navegador.');}

  setTimeout(hide,2200);
  if(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches){if(install)install.hidden=true;}
  else if(window.navigator.standalone){if(install)install.hidden=true;}
})();
